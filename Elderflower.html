<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ohmyfood - Kitchen West</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;700&display=swap&family=Shrikhand&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="main-container">
        <header>
            <div class="navigation">
                <div class="logo-banner">
                    <a href="./index.html" class="back-button">
                        <img src="./images/Button_Icons/Home.png" alt="Home button">
                    </a>
                    <a href="./index.html" class="home-button">
                        <div class="logo">ohmyfood</div>
                    </a>
                    <div class="cart">
                        <img src="./images/Cart.png" alt="Shopping cart icon">
                        <span class="iconCartSpan">0</span>
                    </div>
                </div>
            </div>
        </header>

        <main class="Restaurant-tab">
            <div class="main-content">
                <div>
                    <img src="./images/restaurants/stil-u2Lp8tXIcjw-unsplash.jpg" class="banner"
                        alt="Picture of Elderflower">
                </div>
                <section class="menu max-menuSize">
                    <div class="name-like-group">
                        <h1 class="Restaurants-name">Elderflower</h1>
                        <div class="favourite">
                            <img class="like-color" src="./images/Button_Icons/Like-colour.png" alt="Coloured heart">
                            <img class="like-outline" src="./images/Button_Icons/Like-blank.png"
                                alt="Outline of a heart">
                            <div class="blank"></div>
                        </div>
                    </div>
                </section>
                <section class="cart-tab">
                    <div class="cartHeader">
                        <h2>Cart</h2>
                        <div class="cart-Close">
                            <div class="bar1"></div>
                            <div class="bar2"></div>
                        </div>
                    </div>
                    <div class="cart-list">
                    </div>
                    <div class="cart-btn">
                        <button class="button cart-chkOut">Order</button>
                    </div>
                </section>
            </div>
        </main>

        <footer>
            <a href="index.html" class="logo">ohmyfood</a>
            <div class="Footer-resource-links">
                <div class="Suggest_restaurant">
                    <a href="#" class="Footer-links">
                        <div class="Footer-text_logo">
                            <img src="./images/Button_Icons/cutlery.png" alt="Picture of knife and fork">
                            <p>Suggest a restaurant</p>
                        </div>
                    </a>
                </div>
                <div class="Partner">
                    <a href="#" class="Footer-links">
                        <div class="Footer-text_logo">
                            <img src="./images/Button_Icons/hands.png" alt="Picture of two hands shaking">
                            <p>Become a partner</p>
                        </div>
                    </a>
                </div>
                <div class="Legal">
                    <a href="#" class="Footer-links">
                        <div class="Footer-text_logo">
                            <p>Legal notice</p>
                        </div>
                    </a>
                </div>
                <div class="Contact">
                    <a href="#" class="Footer-links">
                        <div class="Footer-text_logo">
                            <p>Contact</p>
                        </div>
                    </a>
                </div>
            </div>
        </footer>
    </div>
</body>

<script src="cartFunctionality.js"></script>

</html>
